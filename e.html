<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Приглашение на событие</title>

  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:title" content="Приглашение на событие">
  <meta property="og:description" content="Присоединяйтесь к событию в приложении «Встречи и События»">
  <meta property="og:type" content="website">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --violet: #a78bfa;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1.15;
      border-radius: 24px;
      background: linear-gradient(135deg, #62a8ff 0%, #a78bfa 55%, #f472b6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 96px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .chip {
      display: inline-block;
      margin-top: 20px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(167,139,250,.18);
      color: #c4b5fd;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .1px;
    }
    h1 {
      margin: 12px 0 6px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -.5px;
    }
    .date {
      color: var(--muted);
      font-size: 15.5px;
      font-weight: 500;
    }
    .info {
      margin-top: 20px;
      padding: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .info-icon {
      width: 22px; height: 22px;
      flex-shrink: 0;
      color: var(--muted);
    }
    .info-title { font-size: 15px; font-weight: 600; margin: 0; }
    .info-sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
    .spacer { height: 14px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background .2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.04); }
    .hint {
      margin-top: 10px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
    }
    .state {
      text-align: center;
      padding: 60px 20px;
    }
    .state-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 32px;
    }
    .state-error { background: rgba(255,94,107,.12); color: #ff5e6b; }
    .state-loading {
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-title { font-size: 16px; font-weight: 600; }
    .state-text { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="state">
      <div class="state-icon state-loading"></div>
      <div class="state-title">Загрузка приглашения…</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yynwjaeqohbsgkxjuukp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_y08oAM3XLsMdlMkW7rsb2w_L5SOXMOb';
    const APP_SCHEME = 'eventsapp://join?token=';
    const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

    const root = document.getElementById('root');

    function getTokenFromUrl() {
      // /e/<token>
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0] === 'e') return parts[1];
      // fallback: ?token=...
      const url = new URL(window.location.href);
      return url.searchParams.get('token');
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatDate(startIso, endIso) {
      if (!startIso) return 'Дата не указана';
      const start = new Date(startIso);
      const end = endIso ? new Date(endIso) : null;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      let prefix;
      if (startDay.getTime() === today.getTime()) prefix = 'Сегодня';
      else if (startDay.getTime() === today.getTime() + 86400000) prefix = 'Завтра';
      else prefix = `${start.getDate()} ${MONTHS[start.getMonth()]}`;
      const st = String(start.getHours()).padStart(2,'0') + ':' + String(start.getMinutes()).padStart(2,'0');
      if (!end) return `${prefix} в ${st}`;
      const et = String(end.getHours()).padStart(2,'0') + ':' + String(end.getMinutes()).padStart(2,'0');
      return `${prefix} в ${st} – ${et}`;
    }

    function categoryEmoji(cat) {
      const map = {
        'Покер':'♠️','Настолки':'🎲','PlayStation':'🎮','Кальян':'💨',
        'Футбол':'⚽','Хоккей':'🏒','Баскетбол':'🏀','Волейбол':'🏐',
        'Теннис':'🎾','Бильярд':'🎱','Тренажерный зал':'🏋️‍♂️','Картинг':'🏎️',
        'Кино':'🎬','Ресторан':'🍽️','Прогулка':'🚶','Другое':'✨'
      };
      return map[cat] || '✨';
    }

    function renderError(title, text) {
      root.innerHTML = `
        <div class="state">
          <div class="state-icon state-error">⚠️</div>
          <div class="state-title">${escapeHtml(title)}</div>
          <div class="state-text">${escapeHtml(text)}</div>
        </div>
      `;
    }

    function renderPreview(p, token) {
      const title = p.title || 'Событие';
      const category = p.category || 'Другое';
      const emoji = categoryEmoji(category);
      const cover = p.cover_image_url;
      const coverHtml = cover
        ? `<div class="cover"><img src="${escapeHtml(cover)}" alt=""></div>`
        : `<div class="cover">${emoji}</div>`;

      const dateStr = formatDate(p.event_date, p.event_end_date);
      const count = p.participants_count || 0;
      const max = p.max_participants;
      const countStr = max ? `${count} из ${max} участников` : `${count} участников`;

      const location = p.location ? `
        <div class="info">
          <svg class="info-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 21s-7-5.5-7-11a7 7 0 1114 0c0 5.5-7 11-7 11z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
          <div>
            <p class="info-title">${escapeHtml(p.location)}</p>
            ${p.city ? `<p class="info-sub">${escapeHtml(p.city)}</p>` : ''}
          </div>
        </div>
      ` : '';

      const organizer = p.creator_name ? `
        <div class="info">
          <svg class="info-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
          </svg>
          <div>
            <p class="info-title">Организатор</p>
            <p class="info-sub">${escapeHtml(p.creator_name)}</p>
          </div>
        </div>
      ` : '';

      const approval = p.requires_approval ? `
        <div class="info" style="background:rgba(255,197,107,.1);border-color:rgba(255,197,107,.35)">
          <svg class="info-icon" style="color:#ffc56b" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
          </svg>
          <div>
            <p class="info-title">Организатор подтверждает каждого участника</p>
          </div>
        </div>
      ` : '';

      root.innerHTML = `
        ${coverHtml}
        <span class="chip">✨ Частное событие</span>
        <h1>${escapeHtml(title)}</h1>
        <div class="date">${escapeHtml(dateStr)}</div>

        <div class="spacer"></div>
        ${location}
        <div class="spacer"></div>
        ${organizer}

        <div class="info">
          <svg class="info-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/>
            <path d="M2 19c0-3 3.5-4.5 7-4.5s7 1.5 7 4.5"/>
            <path d="M17 13.5c2.6.3 5 1.7 5 4.5"/>
          </svg>
          <div>
            <p class="info-title">${escapeHtml(countStr)}</p>
          </div>
        </div>

        <div class="spacer"></div>
        ${approval}

        <div style="height:28px"></div>

        <a class="btn btn-primary" id="openAppBtn" href="${APP_SCHEME}${encodeURIComponent(token)}">
          Открыть в приложении
        </a>
        <button class="btn btn-secondary" id="installBtn">
          Скачать приложение
        </button>

        <div class="hint">
          Если у вас уже установлено приложение — откройте ссылку в нём.
        </div>
      `;

      document.getElementById('installBtn').addEventListener('click', () => {
        // Android — APK / Play Store (замени, когда будет ссылка)
        // iOS — App Store
        const ua = navigator.userAgent.toLowerCase();
        if (/android/.test(ua)) {
          window.location.href = 'https://friends-events-site.vercel.app/';
        } else if (/iphone|ipad|ipod/.test(ua)) {
          window.location.href = 'https://friends-events-site.vercel.app/';
        } else {
          window.location.href = 'https://friends-events-site.vercel.app/';
        }
      });
    }

    async function init() {
      const token = getTokenFromUrl();
      if (!token) {
        renderError('Ссылка повреждена', 'В адресе нет токена приглашения.');
        return;
      }

      try {
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.rpc('preview_event_by_token', { p_token: token });
        if (error) throw error;
        if (!data) {
          renderError('Ссылка недействительна', 'Событие удалено, или ссылка устарела.');
          return;
        }
        renderPreview(data, token);
      } catch (e) {
        console.error(e);
        renderError('Не удалось загрузить', e.message || String(e));
      }
    }

    init();
  </script>
</body>
</html>
