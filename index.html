<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сходки & Сборы</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="logo">⚽ Сходки & Сборы</div>
    <div class="header-actions">
      <button id="inviteBtn" class="btn btn-outline btn-sm">🔗 Пригласить друга</button>
      
      <div id="userProfile" class="hidden" style="display: flex; align-items: center; gap: 0.75rem;">
        <span id="userName" style="color: #38bdf8; font-weight: 600;"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Выйти</button>
      </div>

      <button id="authBtn" class="btn btn-primary btn-sm">Войти</button>
    </div>
  </header>

  <!-- Главный контент -->
  <main class="container">
    <div class="events-header">
      <h2>Встречи</h2>
      <button id="createEventBtn" class="btn btn-primary hidden">+ Создать ивент</button>
    </div>

    <!-- Фильтры -->
    <div class="filters-bar">
      <div class="categories-tabs" id="categoryFilters">
        <button class="tab-btn active" data-category="all">Все</button>
        <button class="tab-btn" data-category="Спорт">⚽ Спорт</button>
        <button class="tab-btn" data-category="Игры">🎮 Игры</button>
        <button class="tab-btn" data-category="Поездки">🚗 Поездки</button>
        <button class="tab-btn" data-category="Встречи">🍕 Встречи</button>
      </div>
      <button class="tab-btn" style="color: #cbd5e1;">📁 Архив</button>
    </div>

    <!-- Сетка ивентов -->
    <div id="eventsList" class="events-grid">
      <!-- Ивенты рендерятся динамически -->
    </div>
  </main>

  <!-- Модальное окно авторизации -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeAuthModal" class="close-btn">&times;</span>
      <h3 id="modalTitle" style="margin-bottom: 1rem;">Вход в аккаунт</h3>
      <form id="authForm">
        <div class="form-group" id="nameGroup">
          <label>Ваше имя</label>
          <input type="text" id="authName" placeholder="Имя">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary btn-full">Войти</button>
      </form>
      <div class="toggle-auth">
        <span id="toggleAuthText">Нет аккаунта?</span> 
        <a href="#" id="toggleAuthLink">Зарегистрироваться</a>
      </div>
    </div>
  </div>

  <!-- Модальное окно создания ивента -->
  <div id="eventModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeEventModal" class="close-btn">&times;</span>
      <h3 style="margin-bottom: 1rem;">Новая встреча</h3>
      <form id="eventForm">
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="eventTitle" required placeholder="Например: Турнир по FIFA">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="eventCategory" required>
            <option value="Спорт">Спорт</option>
            <option value="Игры">Игры</option>
            <option value="Поездки">Поездки</option>
            <option value="Встречи">Встречи</option>
          </select>
        </div>
        <div class="form-group">
          <label>Дата и время</label>
          <input type="datetime-local" id="eventDate" required>
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="eventDescription" rows="3" placeholder="Подробности встречи..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Создать</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно ЧАТА -->
  <div id="chatModal" class="modal hidden">
    <div class="modal-content" style="max-width: 500px; display: flex; flex-direction: column; max-height: 85vh;">
      <span id="closeChatModal" class="close-btn">&times;</span>
      <h3 id="chatEventTitle" style="margin-bottom: 1rem; font-size: 1.1rem; padding-right: 1.5rem;">Обсуждение встречи</h3>
      
      <!-- Список сообщений -->
      <div id="chatMessages" class="chat-messages-container">
        <!-- Сообщения рендерятся тут -->
      </div>

      <!-- Форма отправки -->
      <form id="chatForm" style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <input type="text" id="chatInput" placeholder="Напишите сообщение..." required style="flex: 1;">
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </div>

  <!-- Уведомления -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
