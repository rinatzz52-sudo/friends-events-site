<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>События</title>
  
  <!-- Иконки и PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn {
      padding: 0.5rem 0.8rem;
      border-radius: 0.5rem;
      border: none;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border-color); color: var(--text-main); }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

    .hidden { display: none !important; }

    .user-profile-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-left: auto;
    }

    .category-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      -webkit-overflow-scrolling: touch;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
    }

    .grid-events {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--border-color);
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
    }

    .chat-container {
      height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-message {
      background: #334155;
      padding: 0.5rem 0.8rem;
      border-radius: 0.5rem;
      max-width: 80%;
      align-self: flex-start;
      word-break: break-word;
    }

    .chat-message.my-message {
      background: var(--primary);
      align-self: flex-end;
    }

    .chat-author { font-size: 0.75rem; color: var(--text-muted); display: block; }
    .chat-time { font-size: 0.65rem; color: var(--text-muted); text-align: right; display: block; margin-top: 0.2rem; }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      z-index: 2000;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1>📅 Встречи и События</h1>
      </div>
      <div class="header-actions">
        <!-- Кнопка установки приложения (PWA) -->
        <button id="installAppBtn" class="btn btn-primary hidden">📲 Скачать приложение</button>
        <button id="enablePushBtn" class="btn btn-secondary">🔔 Уведомления</button>
        <button id="inviteBtn" class="btn btn-outline">🔗 Поделиться</button>
        <button id="createEventBtn" class="btn btn-primary hidden">+ Создать</button>
        <button id="authBtn" class="btn btn-primary">Войти</button>
        
        <div id="userProfile" class="user-profile-box hidden">
          <span id="userName" style="font-weight: 600;"></span>
          <button id="logoutBtn" class="btn btn-outline">Выйти</button>
        </div>
      </div>
    </header>

    <!-- Фильтры категорий -->
    <div id="categoryFilters" class="category-tabs">
      <button class="btn btn-secondary tab-btn active" data-category="all">Все</button>
      <button class="btn btn-secondary tab-btn" data-category="Покер">♠️ Покер</button>
      <button class="btn btn-secondary tab-btn" data-category="PlayStation">🎮 PlayStation</button>
      <button class="btn btn-secondary tab-btn" data-category="Тренажерный зал">🏋️‍♂️ Тренажерный зал</button>
      <button class="btn btn-secondary tab-btn" data-category="Картинг">🏎️ Картинг</button>
      <button class="btn btn-secondary tab-btn" data-category="Кальян">💨 Кальян</button>
      <button class="btn btn-secondary tab-btn" data-category="Другое">🎈 Другое</button>
    </div>

    <!-- Список событий -->
    <div id="eventsList" class="grid-events">
      <p style="color: var(--text-muted);">Загрузка событий...</p>
    </div>
  </div>

  <!-- МОДАЛКА АВТОРИЗАЦИИ -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalTitle">Вход в аккаунт</h2>
      <form id="authForm">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label for="authName">Имя пользователя</label>
          <input type="text" id="authName" placeholder="Иван Иванов">
        </div>
        <div class="form-group">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="authPassword">Пароль</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%;">Войти</button>
      </form>
      <p style="margin-top: 1rem; text-align: center; color: var(--text-muted);">
        <span id="toggleAuthText">Нет аккаунта?</span> 
        <a href="#" id="toggleAuthLink" style="color: var(--primary);">Зарегистрироваться</a>
      </p>
      <button id="closeAuthModal" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem;">Закрыть</button>
    </div>
  </div>

  <!-- МОДАЛКА СОЗДАНИЯ ИВЕНТА -->
  <div id="eventModal" class="modal hidden">
    <div class="modal-content">
      <h2>Создать встречу</h2>
      <form id="eventForm">
        <div class="form-group">
          <label for="eventTitle">Название</label>
          <input type="text" id="eventTitle" required placeholder="Собираемся вместе">
        </div>
        <div class="form-group">
          <label for="eventCategory">Категория</label>
          <select id="eventCategory" required>
            <option value="Покер">♠️ Покер</option>
            <option value="PlayStation">🎮 PlayStation</option>
            <option value="Тренажерный зал">🏋️‍♂️ Тренажерный зал</option>
            <option value="Картинг">🏎️ Картинг</option>
            <option value="Кальян">💨 Кальян</option>
            <option value="Другое" selected>🎈 Другое</option>
          </select>
        </div>
        <div class="form-group">
          <label for="eventDate">Дата и время</label>
          <input type="datetime-local" id="eventDate" required>
        </div>
        <div class="form-group">
          <label for="eventDescription">Описание</label>
          <textarea id="eventDescription" rows="3" placeholder="Где собираемся, что брать с собой..."></textarea>
        </div>
        <div class="form-group">
          <label for="eventMaxParticipants">Макс. участников (оставьте пустым, если без лимита)</label>
          <input type="number" id="eventMaxParticipants" min="1" placeholder="Например: 4">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Опубликовать</button>
      </form>
      <button id="closeEventModal" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem;">Отмена</button>
    </div>
  </div>

  <!-- МОДАЛКА ЧАТА -->
  <div id="chatModal" class="modal hidden">
    <div class="modal-content" style="max-width: 600px;">
      <h3 id="chatEventTitle">Чат встречи</h3>
      <div id="chatMessages" class="chat-container"></div>
      <form id="chatForm" style="display: flex; gap: 0.5rem;">
        <input type="text" id="chatInput" placeholder="Напишите сообщение..." style="flex: 1; padding: 0.6rem; border-radius: 0.4rem; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
      <button id="closeChatModal" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">Закрыть чат</button>
    </div>
  </div>

  <!-- Всплывающее уведомление -->
  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
