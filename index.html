<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сходки & Сборы</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Подключаем официальную библиотеку Supabase для работы с базой данных из браузера -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ (ШАПКА САЙТА) -->
  <header class="header">
    <div class="logo">⚽ Сходки & Сборы</div>
    <div class="header-actions">
      <!-- Кнопка быстрой копировки ссылки на сайт -->
      <button id="inviteBtn" class="btn btn-secondary">🔗 Пригласить друга</button>

      <!-- Блок профиля: виден только когда пользователь ВОШЕЛ в аккаунт -->
      <div id="userProfile" class="user-profile hidden">
        <span id="userName">Пользователь</span>
        <button id="logoutBtn" class="btn btn-outline">Выйти</button>
      </div>

      <!-- Кнопка входа: видна только когда пользователь НЕ авторизован -->
      <button id="authBtn" class="btn btn-primary">Войти / Регистрация</button>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ -->
  <main class="container">
    
    <!-- Заголовок раздела и кнопка создания ивента -->
    <div class="events-header">
      <h2>Встречи</h2>
      <!-- Кнопка доступна только авторизованным пользователям -->
      <button id="createEventBtn" class="btn btn-primary hidden">+ Создать ивент</button>
    </div>

    <!-- ПАНЕЛЬ ФИЛЬТРОВ И АРХИВА -->
    <div class="filters-bar">
      <!-- Кнопки переключения категорий (data-category используется в JS для фильтрации) -->
      <div class="categories-tabs" id="categoryFilters">
        <button class="tab-btn active" data-category="all">Все</button>
        <button class="tab-btn" data-category="Спорт">⚽ Спорт</button>
        <button class="tab-btn" data-category="Игры">🎮 Игры</button>
        <button class="tab-btn" data-category="Поездки">🚗 Поездки</button>
        <button class="tab-btn" data-category="Встречи">🍕 Встречи</button>
      </div>

      <!-- Кнопка переключения между активными ивентами и архивом прошедших -->
      <div class="archive-toggle">
        <button id="toggleArchiveBtn" class="btn btn-sm btn-outline">📁 Архив</button>
      </div>
    </div>

    <!-- СЕТКА КАРТОЧЕК: Сюда JavaScript будет динамически вставлять карточки встреч -->
    <div id="eventsList" class="events-grid"></div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО: Авторизация и Регистрация -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeAuthModal">&times;</span>
      <h3 id="modalTitle">Вход в аккаунт</h3>
      <form id="authForm">
        <!-- Поле "Имя" показывается только при регистрации -->
        <div class="form-group" id="nameGroup">
          <label>Ваше Имя</label>
          <input type="text" id="authName" placeholder="Иван">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="authSubmitBtn">Войти</button>
      </form>
      <!-- Переключатель между Входом и Регистрацией -->
      <p class="toggle-auth">
        <span id="toggleAuthText">Нет аккаунта?</span> 
        <a href="#" id="toggleAuthLink">Зарегистрироваться</a>
      </p>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Создание нового ивента -->
  <div id="eventModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeEventModal">&times;</span>
      <h3>Создать новую встречу</h3>
      <form id="eventForm">
        <div class="form-group">
          <label>Название встречи</label>
          <input type="text" id="eventTitle" required placeholder="Например: Турнир по FIFA">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="eventCategory" required>
            <option value="Спорт">⚽ Спорт</option>
            <option value="Игры">🎮 Игры</option>
            <option value="Поездки">🚗 Поездки</option>
            <option value="Встречи">🍕 Встречи</option>
          </select>
        </div>
        <div class="form-group">
          <label>Дата и время</label>
          <input type="datetime-local" id="eventDate" required>
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="eventDescription" rows="3" placeholder="Детали встречи, где собираемся..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Опубликовать</button>
      </form>
    </div>
  </div>

  <!-- УВЕДОМЛЕНИЕ (Toast): Показывается при скопированной ссылке -->
  <div id="toast" class="toast hidden">Ссылка скопирована в буфер обмена!</div>

  <!-- Подключаем наш скрипт логики -->
  <script src="app.js"></script>
</body>
</html>
